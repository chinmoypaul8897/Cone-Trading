spring.application.name=trading

server.port=${SERVER_PORT:5454}

spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cone_trading}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#spring.jpa.show-sql: true


# Payment gateway credentials - supplied via environment variables.
# See .env.example for the full list.
stripe.api.key=${STRIPE_API_KEY:}

razorpay.api.key=${RAZORPAY_API_KEY:}

razorpay.api.secret=${RAZORPAY_API_SECRET:}
